<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════
  index.html — Portfolio (Visitor View)

  What this page does:
    1. Loads Firebase SDK
    2. Reads /config from Firestore (theme, colors)
    3. Reads /profile, /projects, /skills from Firestore
    4. Applies the selected theme via data-theme on <body>
    5. Renders all content dynamically via portfolio.js

  No server needed — pure static page powered by Firestore.
  ══════════════════════════════════════════════════════════
-->
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>

  <!-- Theme stylesheet -->
  <link rel="stylesheet" href="/css/themes.css" />

  <!-- Google Fonts — all 3 themes pre-loaded -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* Loading state */
    #loading-screen {
      position: fixed; inset: 0;
      background: #080808;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s, visibility 0.4s;
    }
    #loading-screen.hidden { opacity: 0; visibility: hidden; }
    .loader {
      width: 36px; height: 36px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #8B5CF6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Placeholder avatar */
    .avatar-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 64px; background: rgba(139,92,246,0.1);
    }

    /* Fade-in animation on content load */
    .fade-in {
      animation: fadeIn 0.5s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Empty state */
    .empty-state {
      padding: 40px; text-align: center; opacity: 0.4;
      font-style: italic;
    }
  </style>
</head>
<body data-theme="minimal">

  <!-- Loading screen (hidden once data loads) -->
  <div id="loading-screen">
    <div class="loader"></div>
  </div>

  <!-- ── Navigation ────────────────────────────────────── -->
  <nav id="nav">
    <div class="nav-brand" id="nav-brand">Portfolio</div>
    <div class="nav-links">
      <a href="#projects">Projets</a>
      <a href="#skills">Compétences</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <!-- ── Hero ──────────────────────────────────────────── -->
  <section id="hero">
    <div class="hero-left">
      <div class="eyebrow" id="hero-eyebrow">Disponible</div>
      <h1 id="hero-name">Chargement...</h1>
      <p class="bio" id="hero-bio"></p>
      <div class="cta-links">
        <a class="cta-primary" href="#projects">Voir mes projets</a>
        <a class="cta-secondary" id="hero-email" href="#">Me contacter</a>
      </div>
    </div>
    <!-- Avatar (creative theme only) -->
    <div class="hero-right">
      <div class="avatar-card">
        <div id="hero-avatar" class="avatar-placeholder">👤</div>
      </div>
    </div>
  </section>

  <!-- ── Projects ──────────────────────────────────────── -->
  <section id="projects">
    <div class="section-label">Projets</div>
    <h2 class="section-title">Ce que j'ai <span>construit</span></h2>
    <div class="projects-grid" id="projects-grid">
      <div class="empty-state">Chargement des projets...</div>
    </div>
  </section>

  <!-- ── Skills ────────────────────────────────────────── -->
  <section id="skills">
    <div class="section-label">Compétences</div>
    <h2 class="section-title">Mon <span>stack</span></h2>
    <div class="skills-grid" id="skills-grid">
      <div class="empty-state">Chargement...</div>
    </div>
  </section>

  <!-- ── Footer / Contact ──────────────────────────────── -->
  <footer id="contact">
    <div id="footer-copy">© 2025</div>
    <div class="social-links" id="social-links"></div>
  </footer>

  <!-- Firebase SDK (modular, loaded as module) -->
  <script type="module" src="/js/portfolio.js"></script>

</body>
</html>
