<!DOCTYPE html>
<!--
  login.html — Admin authentication gate
  Uses Firebase Auth (email/password).
  On success, redirects to /admin/
-->
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #080808;
      color: #F0EDFF;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 48px 40px;
      backdrop-filter: blur(20px);
    }
    .login-logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 800;
      margin-bottom: 8px;
    }
    .login-logo span { color: #8B5CF6; }
    .login-sub {
      font-size: 14px; color: rgba(255,255,255,0.4);
      margin-bottom: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 0.5px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 8px;
    }
    .field input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #fff; font-family: inherit; font-size: 15px;
      outline: none; transition: border-color 0.15s;
    }
    .field input:focus { border-color: #8B5CF6; }
    .field input::placeholder { color: rgba(255,255,255,0.2); }
    .login-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      color: #fff; font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 700;
      border-radius: 10px; cursor: pointer;
      border: none; margin-top: 8px;
      transition: opacity 0.15s, transform 0.15s;
    }
    .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .login-btn:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }
    .error-msg {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      font-size: 13px; color: #FCA5A5;
    }
    .error-msg.show { display: block; }
    .back-link {
      display: block; text-align: center; margin-top: 24px;
      font-size: 13px; color: rgba(255,255,255,0.3);
      transition: color 0.15s;
    }
    .back-link:hover { color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">Portfolio<span>.</span>admin</div>
    <div class="login-sub">// Connexion requise</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="admin@example.com" autocomplete="username" />
    </div>

    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="login-btn" id="login-btn" onclick="login()">
      Se connecter
    </button>

    <div class="error-msg" id="error-msg"></div>

    <a class="back-link" href="/">← Retour au portfolio</a>
  </div>

  <script type="module">
    import { initializeApp }             from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { firebaseConfig }            from '/js/config.js';

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // If already logged in, go straight to admin
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = '/admin/';
    });

    // Expose login to onclick
    window.login = async function() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errEl    = document.getElementById('error-msg');

      if (!email || !password) {
        errEl.textContent = 'Veuillez remplir tous les champs.';
        errEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Connexion...';
      errEl.classList.remove('show');

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged will redirect
      } catch (e) {
        const messages = {
          'auth/wrong-password':   'Mot de passe incorrect.',
          'auth/user-not-found':   'Aucun compte avec cet email.',
          'auth/invalid-email':    'Email invalide.',
          'auth/too-many-requests':'Trop de tentatives. Réessayez plus tard.',
        };
        errEl.textContent = messages[e.code] || `Erreur : ${e.message}`;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    };

    // Submit on Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') window.login();
    });
  </script>

</body>
</html>
